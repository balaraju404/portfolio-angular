<div class="flex items-center justify-center page-shell">
 <div class="w-full max-w-md surface-card">
  <div class="rounded-t-4xl surface-accent p-8 text-center">
   <p class="text-2xl font-semibold">Welcome back</p>
   <p class="mt-2 text-sm text-on-primary">Sign in to access your portfolio dashboard and curated showcases.</p>
  </div>

  <div class="p-8 space-y-6">
   <div class="space-y-4">
    <lib-field-wrapper label="Username">
     <lib-input placeholder="Enter username" [(value)]="formData.login_name" />
    </lib-field-wrapper>

    <lib-field-wrapper label="Password">
     <lib-password placeholder="Enter password" [(value)]="formData.password" />
    </lib-field-wrapper>
   </div>

   <div class="flex justify-center">
    <lib-button [loading]="loginBtnLoader" (buttonClick)="handleLoginEvent()" class="w-full">Login</lib-button>
   </div>

   <div class="flex flex-col gap-3 text-sm text-secondary sm:flex-row sm:items-center sm:justify-between">
    <button type="button" class="text-left link-muted transition link-primary" (click)="gotoForgotPassword()">Forgot
     password?</button>
    <button type="button" class="text-left link-primary font-semibold transition" (click)="gotoSignupPage()">Create
     account</button>
   </div>
  </div>
 </div>
</div>
