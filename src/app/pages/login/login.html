<div class="flex items-center justify-center bg-slate-50">
 <div class="w-full max-w-md rounded-4xl border border-slate-200 bg-white shadow-xl">
  <div class="rounded-t-4xl bg-indigo-600 p-8 text-center text-white">
   <p class="text-2xl font-semibold">Welcome back</p>
   <p class="mt-2 text-sm text-indigo-100">Sign in to access your portfolio dashboard and curated showcases.</p>
  </div>

  <div class="p-8 space-y-6">
   <div class="space-y-4">
    <lib-field-wrapper label="Username">
     <lib-input placeholder="Enter username" [(value)]="formData.login_name" />
    </lib-field-wrapper>

    <lib-field-wrapper label="Password">
     <lib-password placeholder="Enter password" [(value)]="formData.password" />
    </lib-field-wrapper>
   </div>

   @if (feedbackMessage) {
   <div class="rounded-2xl border px-4 py-3 text-sm"
    [ngClass]="feedbackType === 'success' ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-rose-200 bg-rose-50 text-rose-700'">
    {{ feedbackMessage }}
   </div>
   }

   <div class="flex justify-center">
    <lib-button [loading]="loginBtnLoader" (buttonClick)="handleLoginEvent()" class="w-full">Login</lib-button>
   </div>

   <div class="flex flex-col gap-3 text-sm text-slate-600 sm:flex-row sm:items-center sm:justify-between">
    <button type="button" class="text-left text-slate-500 transition hover:text-indigo-600"
     (click)="gotoForgotPassword()">Forgot password?</button>
    <button type="button" class="text-left text-indigo-600 font-semibold transition hover:text-indigo-700"
     (click)="gotoSignupPage()">Create account</button>
   </div>
  </div>
 </div>
</div>
