<section class="mx-auto max-w-6xl">
 <div class="grid gap-12 lg:grid-cols-[0.9fr_1.1fr] lg:items-start">
  <div class="space-y-6">
   <p class="inline-flex rounded-full bg-indigo-100 px-4 py-1 text-sm font-semibold text-indigo-700">Contact Us</p>
   <h1 class="text-4xl font-semibold tracking-tight text-slate-900 sm:text-5xl">Let’s build something together.</h1>
   <p class="max-w-xl text-lg leading-8 text-slate-600">Have a project in mind, a collaboration idea, or a question
    about using the portfolio platform? Send a message and we’ll get back to you as soon as possible.</p>

   <div class="grid gap-4 sm:grid-cols-2">
    <div class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
     <p class="text-sm font-semibold text-slate-900">Email</p>
     <p class="mt-2 text-slate-600">hello@portfolio.app</p>
    </div>
    <div class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
     <p class="text-sm font-semibold text-slate-900">Location</p>
     <p class="mt-2 text-slate-600">Remote first, available worldwide</p>
    </div>
   </div>
  </div>

  <div class="rounded-4xl bg-white p-8 shadow-xl ring-1 ring-slate-200">
   <form class="space-y-5">
    <div>
     <label class="block text-sm font-semibold text-slate-900">Name</label>
     <input
      class="mt-2 w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
      placeholder="Your name" />
    </div>
    <div>
     <label class="block text-sm font-semibold text-slate-900">Email</label>
     <input
      class="mt-2 w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
      placeholder="you@example.com" />
    </div>
    <div>
     <label class="block text-sm font-semibold text-slate-900">Message</label>
     <textarea
      class="mt-2 w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
      rows="5" placeholder="Tell us about your project"></textarea>
    </div>
    <button type="submit"
     class="inline-flex w-full justify-center rounded-full bg-indigo-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700">Send
     message</button>
   </form>
  </div>
 </div>
</section>
