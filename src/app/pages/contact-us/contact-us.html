<section class="mx-auto max-w-6xl">
 <div class="grid gap-12 lg:grid-cols-[0.9fr_1.1fr] lg:items-start">
  <div class="space-y-6">
   <p class="badge-accent">Contact Us</p>
   <h1 class="text-4xl font-semibold tracking-tight text-strong sm:text-5xl">Let’s build something together.</h1>
   <p class="max-w-xl text-lg leading-8 text-secondary">Have a project in mind, a collaboration idea, or a question
    about using the portfolio platform? Send a message and we’ll get back to you as soon as possible.</p>

   <div class="grid gap-4 sm:grid-cols-2">
    <div class="surface-card p-6">
     <p class="text-sm font-semibold text-strong">Email</p>
     <p class="mt-2 text-secondary">hello@portfolio.app</p>
    </div>
    <div class="surface-card p-6">
     <p class="text-sm font-semibold text-strong">Location</p>
     <p class="mt-2 text-secondary">Remote first, available worldwide</p>
    </div>
   </div>
  </div>

  <div class="form-card p-8">
   <form class="space-y-5">
    <div>
     <label class="block text-sm font-semibold text-strong">Name</label>
     <input class="form-input mt-2" placeholder="Your name" />
    </div>
    <div>
     <label class="block text-sm font-semibold text-strong">Email</label>
     <input class="form-input mt-2" placeholder="you@example.com" />
    </div>
    <div>
     <label class="block text-sm font-semibold text-strong">Message</label>
     <textarea
      class="form-textarea mt-2"
      rows="5" placeholder="Tell us about your project"></textarea>
    </div>
    <button type="submit" class="button-primary w-full">Send message</button>
   </form>
  </div>
 </div>
</section>
