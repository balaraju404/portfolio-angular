<div class="flex items-center justify-center">
 <div class="w-full max-w-md">
  <div class="bg-white shadow-xl rounded-2xl overflow-hidden">
   <div class="p-4 border-b border-gray-100">
    <p class="text-lg font-semibold text-gray-900 text-center">Sign-Up</p>
   </div>
   <div class="p-4 grid grid-cols-2 gap-4">

    <lib-field-wrapper label="First Name">
     <lib-input placeholder="Enter first name" [(value)]="formData.login_name" />
    </lib-field-wrapper>

    <lib-field-wrapper label="Last Name">
     <lib-input placeholder="Enter last name" [(value)]="formData.login_name" />
    </lib-field-wrapper>

    <lib-field-wrapper label="Username">
     <lib-input placeholder="Enter username" [(value)]="formData.login_name" />
    </lib-field-wrapper>

    <lib-field-wrapper label="Password">
     <lib-password placeholder="Enter password" [(value)]="formData.password" />
    </lib-field-wrapper>

    <lib-button [loading]="loginBtnLoader" (buttonClock)="handleLoginEvent()">Create User</lib-button>
    <lib-button [loading]="loginBtnLoader" (buttonClock)="gotoLoginPage()">Goto Login</lib-button>

   </div>
  </div>
 </div>
</div>
