<div class="flex items-center justify-center page-shell">
 <div class="w-full max-w-2xl surface-card">
  <div class="grid gap-6 lg:grid-cols-[1.2fr_1fr]">
   <div class="rounded-4xl surface-accent p-10 lg:rounded-r-none lg:rounded-l-4xl">
    <p class="text-2xl font-semibold">Create your account</p>
    <p class="mt-4 text-sm leading-6 text-on-primary">Start building your portfolio and publish your work to a wider
     audience.</p>
    <div class="mt-8 space-y-4 rounded-3xl surface-accent-soft p-6 text-sm text-secondary">
     <p class="font-semibold">Why join?</p>
     <ul class="space-y-2 pl-4 text-secondary">
      <li>• Manage your portfolio</li>
      <li>• Control privacy settings</li>
      <li>• Publish projects and skills</li>
     </ul>
    </div>
   </div>

   <div class="p-8">
    <div class="mb-6 text-center">
     <p class="text-xl font-semibold text-strong">Sign Up</p>
     <p class="mt-2 text-sm text-secondary">Create an account and start sharing your portfolio.</p>
    </div>

    <div class="grid gap-4">
     <div class="grid gap-4 sm:grid-cols-2">
      <lib-field-wrapper label="First Name">
       <lib-input placeholder="First name" [(value)]="formData.fname" />
      </lib-field-wrapper>
      <lib-field-wrapper label="Last Name">
       <lib-input placeholder="Last name" [(value)]="formData.lname" />
      </lib-field-wrapper>
     </div>

     <lib-field-wrapper label="Username">
      <lib-input placeholder="Username" [(value)]="formData.login_name" />
     </lib-field-wrapper>

     <lib-field-wrapper label="Password">
      <lib-password placeholder="Password" [(value)]="formData.password" />
     </lib-field-wrapper>

     <div class="grid gap-3">
      <lib-button [loading]="loginBtnLoader" (buttonClick)="handleLoginEvent()">Create account</lib-button>
      <button type="button"
       class="button-secondary rounded-2xl"
       (click)="gotoLoginPage()">
       Back to login
      </button>
     </div>
    </div>
   </div>
  </div>
 </div>
</div>
