<nav class="bg-white/90 backdrop-blur-sm sticky top-0 z-50 border-b border-slate-200 shadow-sm">
 <div class="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8">
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
   <div class="flex items-center gap-3">
    <div
     class="flex h-11 w-11 items-center justify-center rounded-2xl bg-indigo-600 text-lg font-bold text-white shadow-sm">
     P
    </div>
    <div>
     <p class="text-lg font-semibold tracking-tight text-slate-900">Portfolio</p>
     <p class="text-sm text-slate-500">Showcase your work and your story</p>
    </div>
   </div>

   <div class="hidden md:flex items-center gap-2">
    @for (item of tabsList; track $index) {
    <button type="button" (click)="handleTabEvent(item)"
     [attr.aria-current]="selectedTab?.link === item.link ? 'page' : null"
     class="rounded-full px-4 py-2 text-sm font-semibold transition focus:outline-none focus:ring-2 focus:ring-indigo-500 {{ selectedTab?.link === item.link ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-700 hover:bg-slate-100' }}">
     {{ item.name }}
    </button>
    }
   </div>

   <div class="flex items-center gap-2">
    @if (userData) {
    <div
     class="hidden items-center gap-3 rounded-full border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-900 md:flex">
     <div
      class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-600 text-sm font-semibold text-white">
      {{ userInitials }}
     </div>
     <div class="text-left">
      <p class="font-semibold">{{ userFullName }}</p>
      <p class="text-xs text-slate-500">Signed in</p>
     </div>
    </div>
    <button type="button" (click)="logout()"
     class="hidden rounded-full bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-200 md:inline-flex">
     Logout
    </button>
    } @else {
    <button type="button" (click)="gotoLogin()"
     class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-900 transition hover:bg-slate-50">
     Login
    </button>
    <button type="button" (click)="gotoSignup()"
     class="hidden rounded-full bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-700 md:inline-flex">
     Sign Up
    </button>
    }

    <button type="button"
     class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 text-slate-700 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 md:hidden"
     (click)="toggleMobile()" [attr.aria-expanded]="mobileOpen ? 'true' : 'false'">
     <span class="sr-only">Toggle navigation</span>
     @if(!mobileOpen){<span>Menu</span>}
     @if(mobileOpen){<span>Close</span>}
    </button>
   </div>
  </div>

  @if (mobileOpen) {
  <div class="mt-3 rounded-3xl border border-slate-200 bg-white p-3 shadow-sm md:hidden">
   <div class="space-y-2">
    @for (item of tabsList; track $index) {
    <button type="button" (click)="handleTabEvent(item)"
     class="w-full rounded-2xl px-4 py-3 text-left text-sm font-semibold transition {{ selectedTab?.link === item.link ? 'bg-indigo-600 text-white' : 'text-slate-700 hover:bg-slate-50' }}">
     {{ item.name }}
    </button>
    }

    @if (userData) {
    <button type="button" (click)="logout()"
     class="w-full rounded-2xl bg-slate-100 px-4 py-3 text-left text-sm font-semibold text-slate-700 hover:bg-slate-200">
     Logout
    </button>
    } @else {
    <button type="button" (click)="gotoLogin()"
     class="w-full rounded-2xl bg-slate-100 px-4 py-3 text-left text-sm font-semibold text-slate-700 hover:bg-slate-200">
     Login
    </button>
    <button type="button" (click)="gotoSignup()"
     class="w-full rounded-2xl bg-indigo-600 px-4 py-3 text-left text-sm font-semibold text-white hover:bg-indigo-700">
     Sign Up
    </button>
    }
   </div>
  </div>
  }
 </div>
</nav>
