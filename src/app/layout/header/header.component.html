<nav class="app-header">
 <div class="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8">
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
   <div class="flex items-center gap-3">
    <div class="brand-badge">
     P
    </div>
    <div>
     <p class="text-lg font-semibold tracking-tight text-strong">Portfolio</p>
     <p class="text-sm text-muted">Showcase your work and your story</p>
    </div>
   </div>

   <div class="hidden md:flex items-center gap-2">
    @for (item of tabsList; track $index) {
    <button type="button" (click)="handleTabEvent(item)"
     [attr.aria-current]="selectedTab?.link === item.link ? 'page' : null"
     class="rounded-full px-4 py-2 text-sm font-semibold transition focus:outline-none focus:ring-2 focus:ring-indigo-500 {{ selectedTab?.link === item.link ? 'button-primary' : 'button-secondary' }}">
     {{ item.name }}
    </button>
    }
   </div>

   <div class="flex items-center gap-2">
    @if (userData) {
    <div class="hidden items-center gap-3 surface-card px-3 py-2 text-sm md:flex">
     <div class="profile-badge">{{ userInitials }}</div>
     <div class="text-left">
      <p class="font-semibold">{{ userFullName }}</p>
      <p class="text-xs text-muted">Signed in</p>
     </div>
    </div>
    <button type="button" (click)="logout()" class="hidden button-secondary md:inline-flex">
     Logout
    </button>
    } @else {
    <button type="button" (click)="gotoLogin()" class="button-secondary rounded-full">
     Login
    </button>
    <button type="button" (click)="gotoSignup()" class="hidden button-primary md:inline-flex">
     Sign Up
    </button>
    }

    <button type="button" class="button-icon mobile-menu-toggle" (click)="toggleMobile()"
     [attr.aria-expanded]="mobileOpen ? 'true' : 'false'">
     <span class="sr-only">Toggle navigation</span>
     <span>{{ mobileOpen ? 'Close' : 'Menu' }}</span>
    </button>
   </div>
  </div>

  @if (mobileOpen) {
  <div class="mt-3 surface-card md:hidden">
   <div class="space-y-2">
    @for (item of tabsList; track $index) {
    <button type="button" (click)="handleTabEvent(item)"
     class="w-full rounded-2xl text-left text-sm font-semibold transition {{ selectedTab?.link === item.link ? 'button-primary' : 'button-secondary' }}">
     {{ item.name }}
    </button>
    }

    @if (userData) {
    <button type="button" (click)="logout()" class="w-full button-secondary text-left">
     Logout
    </button>
    } @else {
    <button type="button" (click)="gotoLogin()" class="w-full button-secondary text-left">
     Login
    </button>
    <button type="button" (click)="gotoSignup()" class="w-full button-primary text-left">
     Sign Up
    </button>
    }
   </div>
  </div>
  }
 </div>
</nav>
