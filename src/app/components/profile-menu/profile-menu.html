<div
 class="absolute right-0 top-12 z-50 w-60 overflow-hidden rounded-xl border border-slate-200 bg-white py-1.5 shadow-xl shadow-slate-900/10 ring-1 ring-black/5">
 <!-- Account -->
 <div class="px-3 pb-1 pt-2">
  <p class="px-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400">
   Account
  </p>
 </div>

 <button type="button" (click)="profileClick()"
  class="group flex w-full items-center gap-3 px-3 py-2.5 text-left transition hover:bg-slate-50">
  <span
   class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-slate-600 transition group-hover:bg-slate-200">
   <!-- User icon -->
   <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round"
     d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a7.5 7.5 0 0 1 15 0" />
   </svg>
  </span>

  <span class="min-w-0 flex-1">
   <span class="block text-sm font-medium text-slate-700"> View profile </span>
   <span class="block text-xs text-slate-400"> Manage your account </span>
  </span>

  <svg class="h-4 w-4 text-slate-300 transition group-hover:translate-x-0.5 group-hover:text-slate-400"
   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
   <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
  </svg>
 </button>

 @if (isAdmin()) {
 <!-- Administration -->
 <div class="my-2 border-t border-slate-100"></div>

 <div class="px-3 pb-1 pt-1">
  <p class="px-2 text-[11px] font-semibold uppercase tracking-wider text-indigo-500">
   Administration
  </p>
 </div>

 <button type="button" (click)="sectionsClick()"
  class="group flex w-full items-center gap-3 px-3 py-2.5 text-left transition hover:bg-indigo-50/60">
  <span
   class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600 transition group-hover:bg-indigo-100">
   <!-- Layout / sections icon -->
   <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
    <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
    <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
    <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
   </svg>
  </span>

  <span class="min-w-0 flex-1">
   <span class="block text-sm font-medium text-slate-700"> Sections </span>
   <span class="block text-xs text-slate-400"> Manage application sections </span>
  </span>

  <svg class="h-4 w-4 text-slate-300 transition group-hover:translate-x-0.5 group-hover:text-indigo-400"
   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
   <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
  </svg>
 </button>
 }

 <!-- Logout -->
 <div class="my-2 border-t border-slate-100"></div>

 <button type="button" (click)="logoutClick()"
  class="group flex w-full items-center gap-3 px-3 py-2.5 text-left transition hover:bg-red-50">
  <span
   class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-red-50 text-red-500 transition group-hover:bg-red-100">
   <!-- Logout icon -->
   <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round"
     d="M15.75 8.25V6a2.25 2.25 0 0 0-2.25-2.25h-6A2.25 2.25 0 0 0 5.25 6v12A2.25 2.25 0 0 0 7.5 20.25h6A2.25 2.25 0 0 0 15.75 18v-2.25" />
    <path stroke-linecap="round" stroke-linejoin="round" d="M18 8.25 21 12l-3 3.75M21 12H9.75" />
   </svg>
  </span>

  <span class="text-sm font-medium text-red-600">
   Logout
  </span>
 </button>
</div>
