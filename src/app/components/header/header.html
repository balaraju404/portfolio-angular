<header class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur">
 <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
  <!-- Brand -->
  <button type="button" (click)="home()"
   class="flex items-center gap-2 text-lg font-bold tracking-tight text-slate-900">
   <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white">
    {{appName.at(0)}}
   </span>

   <span>{{appName}}</span>
  </button>

  <!-- Navigation -->
  <nav class="hidden items-center gap-1 md:flex">
   @for (tab of tabs; track tab.route) {
   @let isActive = (currentRoute$ | async) === '/' + tab.route;
   <button type="button" (click)="navigate(tab.route)" [class.bg-slate-100]="isActive" [class.text-slate-900]="isActive"
    class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
    {{ tab.label }}
   </button>
   }
  </nav>

  <!-- Account -->
  <div class="flex items-center gap-3">
   @if (authStore.isLoggedIn()) {
   <button type="button" (click)="profile()"
    class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-900 text-sm font-semibold text-white transition hover:bg-slate-700"
    aria-label="Profile">
    JD
   </button>
   }@else {
   <button type="button" (click)="login()"
    class="hidden text-sm font-medium text-slate-600 hover:text-slate-900 sm:block">
    Login
   </button>
   }
  </div>

 </div>
</header>
