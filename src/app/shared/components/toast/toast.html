@let list = toastList();

@if (list.length > 0) {
<div class="toast-container" role="status" aria-live="polite" aria-atomic="true">
 @for (toast of list; track $index) {
 <div class="toast {{ toast.type }}">
  <div class="toast-content">
   <span class="toast-icon" aria-hidden="true">{{ getIcon(toast.type) }}</span>
   <div class="toast-message">{{ toast.message }}</div>
  </div>
  <button class="toast-close" type="button" aria-label="Dismiss toast" (click)="dismissToast(toast.id)">×</button>
 </div>
 }
</div>
}
