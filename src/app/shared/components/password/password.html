<div class="password-wrapper">
 <input [type]="showPassword() ? 'text' : 'password'" [value]="value()" [placeholder]="placeholder()"
  [disabled]="disabled()" [readonly]="readonly()" [required]="required()" (input)="handleInput($event)"
  (blur)="handleBlur($event)" />

 <button type="button" class="toggle-button" [disabled]="disabled()" (click)="togglePasswordVisibility()">
  {{ showPassword() ? 'Hide' : 'Show' }}
 </button>
</div>
