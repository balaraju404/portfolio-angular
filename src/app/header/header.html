<header class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur">
 <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">

  <!-- Brand -->
  <a routerLink="/" class="flex items-center gap-2 text-lg font-bold tracking-tight text-slate-900">
   <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white">
    P
   </span>

   <span>Portfolio Builder</span>
  </a>

  <!-- Navigation -->
  <nav class="hidden items-center gap-1 md:flex">
   <a routerLink="/" routerLinkActive="bg-slate-100 text-slate-900" [routerLinkActiveOptions]="{ exact: true }"
    class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
    Home
   </a>

   <a routerLink="/templates" routerLinkActive="bg-slate-100 text-slate-900"
    class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
    Templates
   </a>

   <a routerLink="/projects" routerLinkActive="bg-slate-100 text-slate-900"
    class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
    My Projects
   </a>

   <a routerLink="/about" routerLinkActive="bg-slate-100 text-slate-900"
    class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
    About
   </a>
  </nav>

  <!-- Account -->
  <div class="flex items-center gap-3">
   <a routerLink="/login" class="hidden text-sm font-medium text-slate-600 hover:text-slate-900 sm:block">
    Login
   </a>

   <a routerLink="/profile"
    class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-900 text-sm font-semibold text-white transition hover:bg-slate-700"
    aria-label="Profile">
    JD
   </a>
  </div>
 </div>
</header>
